$schema: https://tabledoc.queria.io/schemas/dataset/v1.json
name: etsuran
title: 建設業者・宅建業者等企業情報検索システム
description: |-
  国土交通省の建設業者・宅建業者等企業情報検索システムに載っている事業者の一覧です。今は建設業の許可業者（construction）と宅地建物取引業者（real_estate）を収録しています。許可業者の一覧は許可番号と許可を受けている業種を持ちます。

  出典：「建設業者・宅建業者等企業情報検索システム」（国土交通省）。Queria が加工したものです。
